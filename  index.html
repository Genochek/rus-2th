function showPanel(mode){lastFocus=document.activeElement;modalOpen=true;document.querySelector('#overlay').classList.add('open');document.querySelector('#overlay').setAttribute('aria-hidden','false');document.querySelector('#panelTitle').textContent=mode==='menu'?'Содержание':'Источники информации';document.querySelector('#panelBody').innerHTML=mode==='menu'?`<div class="menu-grid">${titles.map((t,i)=>`<button class="jump ${i===current?'selected':''}" data-jump="${i}"><span>${String(i+1).padStart(2,'0')}</span>${E(t)}</button>`).join('')}</div>`:`<div class="sources-list">${sourceData.map(s=>`<a target="_blank" rel="noopener noreferrer" href="${E(s[2])}">${E(s[0])}<small>${E(s[1])}</small></a>`).join('')}</div>`;document.querySelector('#close').focus();}
function closePanel(){modalOpen=false;document.querySelector('#overlay').classList.remove('open');document.querySelector('#overlay').setAttribute('aria-hidden','true');lastFocus?.focus();}
document.querySelector('#menuBtn').onclick=()=>showPanel('menu');document.querySelector('#sourcesBtn').onclick=()=>showPanel('sources');document.querySelector('#close').onclick=closePanel;document.querySelector('#overlay').onclick=e=>{const j=e.target.closest('[data-jump]');if(j){go(+j.dataset.jump);closePanel();}else if(e.target.id==='overlay')closePanel();};document.querySelector('#prev').onclick=()=>go(current-1);document.querySelector('#next').onclick=()=>go(current+1);
function fullscreen(){if(!document.fullscreenElement){if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});}else document.exitFullscreen?.();}document.querySelector('#fullBtn').onclick=fullscreen;if(!document.fullscreenEnabled)document.querySelector('#fullBtn').style.display='none';
document.addEventListener('keydown',e=>{if(modalOpen){if(e.key==='Escape')closePanel();return;}if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();go(current+1)}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(current-1)}if(e.key==='Home'){e.preventDefault();go(0)}if(e.key==='End'){e.preventDefault();go(slides.length-1)}if(e.key.toLowerCase()==='f')fullscreen();});
let start=null;main.addEventListener('touchstart',e=>{start=[e.touches[0].clientX,e.touches[0].clientY]},{passive:true});main.addEventListener('touchend',e=>{if(!start)return;let dx=e.changedTouches[0].clientX-start[0],dy=e.changedTouches[0].clientY-start[1];start=null;if(Math.abs(dx)>75&&Math.abs(dx)>Math.abs(dy)*1.5)go(current+(dx<0?1:-1));},{passive:true});
function fit(){const w=window.innerWidth,h=window.innerHeight;const mobile=w/h<.86;stage.classList.toggle('mobile',mobile);const sw=mobile?430:1440,sh=mobile?820:810;stage.style.setProperty('--scale',Math.min(w/sw,h/sh));}window.addEventListener('resize',fit);window.addEventListener('orientationchange',fit);fit();go(0);
</script></body></html>
